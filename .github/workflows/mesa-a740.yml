name: Mesa A740 ir3 patch
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:26.04
    steps:
      - name: Core build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential dpkg-dev devscripts fakeroot quilt python3-yaml python3-mako \
            python3-setuptools python3-packaging git curl ca-certificates xz-utils
      - name: Build deps + mesa source
        run: |
          echo "deb-src http://archive.ubuntu.com/ubuntu resolute main universe" >> /etc/apt/sources.list
          echo "deb-src http://archive.ubuntu.com/ubuntu resolute-updates main universe" >> /etc/apt/sources.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y mesa
          apt-get source mesa
          ls -d mesa-*/
      - name: Apply ir3 A740 patch
        run: |
          cd mesa-*/
          python3 - <<'PYEOF'
          import glob
          f=glob.glob('src/freedreno/ir3/ir3_nir_analyze_ubo_ranges.c')[0]
          s=open(f).read()
          old="      if (rsrc && nir_src_is_const(rsrc->src[0])) {"
          new="      if (rsrc && nir_src_is_const(rsrc->src[0]) &&\n          nir_src_is_const(instr->src[1])) {"
          assert old in s, "pattern not found"
          open(f,'w').write(s.replace(old,new,1))
          print("ir3 A740 patch applied")
          PYEOF
      - name: dpkg-buildpackage (Ubuntu ABI)
        run: |
          cd mesa-*/
          DEB_BUILD_OPTIONS="nocheck parallel=$(nproc)" dpkg-buildpackage -b -us -uc -d
      - name: Collect debs
        run: |
          mkdir -p out
          cp *.deb out/ 2>/dev/null || true
          find . -maxdepth 1 -name '*.deb' -exec cp {} out/ \; 2>/dev/null
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-a740-debs
          path: out/

name: Cleanup failed runs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          ids=$(gh run list --repo "${{ github.repository }}" --status failure --limit 100 --json databaseId --jq '.[].databaseId')
          if [ -z "$ids" ]; then echo "no failed runs"; exit 0; fi
          for id in $ids; do
            echo "deleting failed run $id"
            gh run delete "$id" --repo "${{ github.repository }}" || true
          done